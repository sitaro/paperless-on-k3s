---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-env
  namespace: paperless
data:
  PAPERLESS_REDIS: redis://broker:6379
  PAPERLESS_DBHOST: db
  PAPERLESS_DBENGINE: postgresql  # v3: Pflicht
  PAPERLESS_PORT: "8000"
  PAPERLESS_URL: https://ppl.mathops.info
  PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
  PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
  PAPERLESS_TIKA_ENDPOINT: http://tika:9998
  PAPERLESS_OCR_LANGUAGE: deu
  PAPERLESS_TIKA_ENABLED: "1"
  #PAPERLESS_OCR_MODE: "force"
  # v3: v2-Verhalten beibehalten (immer Archiv-PDF, Duplikate ablehnen)
  PAPERLESS_ARCHIVE_FILE_GENERATION: always
  PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
  # CSRF Fix für zweite Domain
  PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://ppl.mathops.info,https://ppl.gemaris.paezolt.com"
  PAPERLESS_ALLOWED_HOSTS: "ppl.mathops.info,ppl.gemaris.paezolt.com"
  PAPERLESS_CORS_ALLOWED_HOSTS: "https://ppl.mathops.info,https://ppl.gemaris.paezolt.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
        envFrom:
        - configMapRef:
            name: paperless-env
        # PAPERLESS_SECRET_KEY (v3: Pflicht), nicht im Repo:
        # kubectl create secret generic paperless-secret -n paperless --from-literal=PAPERLESS_SECRET_KEY=...
        - secretRef:
            name: paperless-secret
        volumeMounts:
        - name: data-storage
          mountPath: /usr/src/paperless/data
        - name: media-storage
          mountPath: /usr/src/paperless/media
        - name: export-storage
          mountPath: /usr/src/paperless/export
        - name: consume-storage
          mountPath: /usr/src/paperless/consume
        ports:
        - containerPort: 8000
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: paperless-data-claim
      - name: media-storage
        persistentVolumeClaim:
          claimName: paperless-media-claim
      - name: export-storage
        persistentVolumeClaim:
          claimName: paperless-export-claim
      - name: consume-storage
        persistentVolumeClaim:
          claimName: paperless-consume-claim
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
